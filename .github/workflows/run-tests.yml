name: Run SystemVerilog Tests

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Ensure test data dir exists
      run: |
        mkdir -p "$GITHUB_WORKSPACE/src/tests/tests_data"
        touch "$GITHUB_WORKSPACE/src/tests/tests_data/.gitkeep"
        echo "Ensured: $GITHUB_WORKSPACE/src/tests/tests_data (placeholder .gitkeep)"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          libgtest-dev \
          googletest
        
    - name: Format code
      run: |
        find . -name '*.cpp' -o -name '*.h' -o -name '*.hpp' | xargs clang-format -i

    - name: Build project
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j4
        
    - name: Run tests
      run: |
        # Перейти в build и запустить тесты оттуда — тогда ../src/tests/tests_data найдётся корректно.
        set -e
        cd "$GITHUB_WORKSPACE/build"
        echo "cwd: $(pwd)"
        echo "ls ../src/tests:"
        ls -la ../src/tests || true
        echo "ls ../src/tests/tests_data:"
        ls -la ../src/tests/tests_data || true
        ./run_tests
